name: Release Desktop Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.1.0). Defaults to current ref name.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon (.dmg)
            os: macos-latest
            rust_target: aarch64-apple-darwin
            bundles: dmg
            bundle_glob: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            artifact_name: installer-macos-aarch64
            is_linux: false
          - label: macOS Intel (.dmg)
            os: macos-latest
            rust_target: x86_64-apple-darwin
            bundles: dmg
            bundle_glob: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            artifact_name: installer-macos-x64
            is_linux: false
          - label: Windows x64 (.exe)
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
            bundle_glob: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            artifact_name: installer-windows-x64
            is_linux: false
          - label: Linux x64 (.AppImage / .deb / .rpm)
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundles: deb,appimage,rpm
            bundle_glob: target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            artifact_name: installer-linux-x64
            is_linux: true

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri system dependencies
        if: matrix.is_linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri installer bundle
        env:
          CI: true
        run: pnpm --filter @vessel/desktop tauri build --bundles ${{ matrix.bundles }} --target ${{ matrix.rust_target }}

      - name: Collect installers into staging directory
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for file in ${{ matrix.bundle_glob }}; do
            cp "$file" release-assets/
          done
          ls -la release-assets/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: error

      - name: Upload Linux binary for Flatpak bundling
        if: matrix.is_linux
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bin-x64
          path: target/x86_64-unknown-linux-gnu/release/vessel-desktop
          if-no-files-found: error

  build-flatpak:
    name: Build (Linux Flatpak bundle)
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled Linux binary
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bin-x64
          path: flatpak-staging

      - name: Install Flatpak & GNOME 51 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Build single-file .flatpak bundle
        run: |
          chmod +x flatpak-staging/vessel-desktop
          cp packaging/flatpak/dev.falsis.vessel.yml flatpak-staging/
          cp packaging/flatpak/dev.falsis.vessel.desktop flatpak-staging/
          cp packaging/flatpak/dev.falsis.vessel.metainfo.xml flatpak-staging/
          cp apps/desktop/src-tauri/icons/32x32.png flatpak-staging/
          cp apps/desktop/src-tauri/icons/128x128.png flatpak-staging/
          cp apps/desktop/src-tauri/icons/icon.png flatpak-staging/

          flatpak-builder --user --force-clean --repo=flatpak-repo flatpak-build flatpak-staging/dev.falsis.vessel.yml
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="dev"
          fi
          mkdir -p flatpak-release
          flatpak build-bundle flatpak-repo "flatpak-release/Vessel_${VERSION}_amd64.flatpak" dev.falsis.vessel
          ls -lh flatpak-release/

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-flatpak
          path: flatpak-release/*.flatpak
          if-no-files-found: error

  build-android:
    name: Build (Android .apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android-ffi

      - name: Build Rust JNI libraries
        run: bash apps/android/build-rust-jni.sh release

      - name: Decode Android release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret for signed APK builds." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/vessel-release.jks"

      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/vessel-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK signature and stage artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="dev"
          fi
          mkdir -p android-release
          APK_PATH="$(find apps/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK produced in apps/android/app/build/outputs/apk/release" >&2
            exit 1
          fi
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner tool not found in Android SDK build-tools" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK_PATH"
          cp "$APK_PATH" "android-release/Vessel_${VERSION}_android.apk"
          rm -f "${{ runner.temp }}/vessel-release.jks"
          ls -lh android-release/

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-android-apk
          path: android-release/*.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build, build-flatpak, build-android]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installer-*
          merge-multiple: true

      - name: List release assets
        run: ls -lh artifacts/

      - name: Create GitHub Release with Patch Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Vessel ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/*
