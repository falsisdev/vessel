[package]
name = "vessel-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vessel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["macos-private-api"] }
tokio.workspace = true
url.workspace = true
vessel-domain = { path = "../../../crates/vessel-domain" }
vessel-engine = { path = "../../../crates/vessel-engine" }
vessel-player-mpv = { path = "../../../crates/vessel-player-mpv" }
vessel-plugin-rt = { path = "../../../crates/vessel-plugin-rt" }
vessel-storage = { path = "../../../crates/vessel-storage" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
