app-id: dev.falsis.vessel
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: vessel-desktop
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Flatpak
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
modules:
  - name: vessel
    buildsystem: simple
    build-commands:
      - install -Dm755 vessel-desktop /app/bin/vessel-desktop
      - install -Dm644 dev.falsis.vessel.desktop /app/share/applications/dev.falsis.vessel.desktop
      - install -Dm644 dev.falsis.vessel.metainfo.xml /app/share/metainfo/dev.falsis.vessel.metainfo.xml
      - install -Dm644 icons/32x32.png /app/share/icons/hicolor/32x32/apps/dev.falsis.vessel.png
      - install -Dm644 icons/128x128.png /app/share/icons/hicolor/128x128/apps/dev.falsis.vessel.png
      - install -Dm644 icons/icon.png /app/share/icons/hicolor/512x512/apps/dev.falsis.vessel.png
    sources:
      - type: file
        path: vessel-desktop
      - type: file
        path: dev.falsis.vessel.desktop
      - type: file
        path: dev.falsis.vessel.metainfo.xml
      - type: file
        path: 32x32.png
        dest: icons
      - type: file
        path: 128x128.png
        dest: icons
      - type: file
        path: icon.png
        dest: icons
