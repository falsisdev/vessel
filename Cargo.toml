[workspace]
resolver = "2"
members = ["crates/vessel-domain", "crates/vessel-storage"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/falsisdev/vessel"

[workspace.dependencies]
async-trait = "0.1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
