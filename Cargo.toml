[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/vessel-domain", "crates/vessel-downloader", "crates/vessel-engine", "crates/vessel-iptv", "crates/vessel-metadata", "crates/vessel-player-mpv", "crates/vessel-plugin-rt", "crates/vessel-proxy", "crates/vessel-storage"]

[workspace.package]
version = "0.1.1-alpha.5"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/falsisdev/vessel"

[workspace.dependencies]
aes = "0.9"
aes-gcm = "0.11"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
cbc = { version = "0.2", features = ["alloc"] }
cipher = "0.5"
ecb = { version = "0.2", features = ["alloc"] }
ego-tree = "0.11"
getrandom = { version = "0.4", features = ["std"] }
hmac = "0.13"
md-5 = "0.11"
oxc = { version = "0.159", features = ["codegen", "semantic", "transformer"] }
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "query", "rustls", "stream"] }
rquickjs = { version = "0.14", features = ["futures", "loader", "macro", "parallel"] }
rusqlite = { version = "0.43", features = ["bundled"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.54", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
url = "2"
zip = { version = "9.8", default-features = false, features = ["deflate"] }

[profile.dev.package."*"]
opt-level = 2
