[workspace]
resolver = "2"
members = ["crates/vessel-domain", "crates/vessel-plugin-rt", "crates/vessel-proxy", "crates/vessel-storage"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/falsisdev/vessel"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
getrandom = { version = "0.4", features = ["std"] }
hmac = "0.13"
oxc = { version = "0.159", features = ["codegen", "semantic", "transformer"] }
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "rustls", "stream"] }
rquickjs = { version = "0.14", features = ["futures", "loader", "macro", "parallel"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "net", "rt", "sync", "time"] }
url = "2"
